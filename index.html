<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>דעוה-לינגו - לימוד ערבית ספרותית</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-owl: 88, 204, 2;
      --color-tree-frog: 88, 167, 0;
      --color-macaw: 28, 176, 246;
      --color-macaw-shadow: 0, 150, 221;
      --color-bee: 255, 200, 0;
      --color-camel: 231, 166, 1;
      --color-cardinal: 255, 75, 75;
      --color-fire-ant: 234, 43, 43;
      --color-fox: 255, 150, 0;
      --color-beetle: 206, 130, 255;
      --color-swan: 229, 229, 229;
      --color-hare: 175, 175, 175;
      --color-wolf: 119, 119, 119;
      --color-eel: 75, 75, 75;
      --color-polar: 247, 247, 247;
      --color-iguana: 221, 244, 255;
      --color-sea-sponge: 215, 255, 184;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Rubik', sans-serif; margin: 0; background: #ffffff; color: #3c3c3c; }
    .font-arabic { font-family: 'Noto Naskh Arabic', serif; }
    
    .duo-btn-green {
      background-color: rgb(var(--color-owl));
      box-shadow: 0 4px 0 rgb(var(--color-tree-frog));
      color: white;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-green:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-tree-frog));
    }
    .duo-btn-blue {
      background-color: rgb(var(--color-macaw));
      box-shadow: 0 4px 0 rgb(var(--color-macaw-shadow));
      color: white;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-blue:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-macaw-shadow));
    }
    .duo-btn-red {
      background-color: rgb(var(--color-cardinal));
      box-shadow: 0 4px 0 rgb(var(--color-fire-ant));
      color: white;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .duo-btn-red:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-fire-ant));
    }
    .duo-btn-outline {
      background-color: white;
      border: 2px solid rgb(var(--color-swan));
      box-shadow: 0 4px 0 rgb(var(--color-swan));
      color: rgb(var(--color-eel));
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
    }
    .duo-btn-outline:hover {
      background-color: rgb(var(--color-polar));
    }
    .duo-btn-outline:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 rgb(var(--color-swan));
    }
    .duo-btn-selected {
      background-color: rgb(var(--color-iguana));
      border: 2px solid rgb(var(--color-macaw));
      box-shadow: 0 4px 0 rgb(var(--color-macaw));
      color: rgb(24, 153, 214);
    }


    /* ---- Arabic on-screen keyboard: light-blue (תכלת) design ---- */
    .kb-toggle-btn { background: linear-gradient(180deg, #f4fbff 0%, #d4f0ff 100%); border: 2px solid #84d8ff; box-shadow: 0 4px 0 #5cc6f7; color: #1899d6; cursor: pointer; transition: transform .1s, box-shadow .1s, background .15s; }
    .kb-toggle-btn:hover { background: linear-gradient(180deg, #ffffff 0%, #c2ebff 100%); }
    .kb-toggle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #5cc6f7; }
    .kb-toggle-btn.kb-on { background: linear-gradient(180deg, #52c7fb 0%, #1cb0f6 100%); border-color: #0e9be0; box-shadow: 0 4px 0 #0f8fd0; color: #ffffff; }
    .kb-toggle-btn.kb-on:active { box-shadow: 0 0 0 #0f8fd0; }
    .kb-panel { background: linear-gradient(180deg, #f4fbff 0%, #def3ff 100%); border-top: 3px solid #84d8ff; border-radius: 24px 24px 0 0; box-shadow: 0 -12px 34px rgba(28, 176, 246, .22); }
    .kb-key { background: #ffffff; border: 2px solid #bfe8fd; box-shadow: 0 3px 0 #9fd8f6; color: #17689a; transition: transform .08s, box-shadow .08s, background .12s; }
    .kb-key:hover { background: #e8f7ff; }
    .kb-key:active { transform: translateY(3px); box-shadow: 0 0 0 #9fd8f6; background: #d4f0ff; }
    .kb-key-mark { background: #e3f5ff; border-color: #84d8ff; color: #1478b3; }
    .kb-close { background: #ffffff; border: 2px solid #bfe8fd; color: #1899d6; }
    .kb-close:hover { background: #e8f7ff; }

    /* Smooth sliding progress bar */
    .duo-progress-fill {
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes duoBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .duo-start-tooltip { animation: duoBounce 1.5s infinite ease-in-out; }

    @keyframes flashFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(2.5deg); }
    }
    @keyframes flashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.11); }
    }
    @keyframes flashWiggle {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes flashSteam {
      0% { transform: translateY(2px); opacity: 0.3; }
      50% { transform: translateY(-3px); opacity: 1; }
      100% { transform: translateY(-7px); opacity: 0; }
    }
    @keyframes gazelleBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes gazelleEarTwitch {
      0%, 85%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-8deg); }
      95% { transform: rotate(5deg); }
    }
    .flash-float { animation: flashFloat 2.4s infinite ease-in-out; transform-origin: center; }
    .flash-pulse { animation: flashPulse 2s infinite ease-in-out; transform-origin: center; }
    .flash-wiggle { animation: flashWiggle 2.2s infinite ease-in-out; transform-origin: center; }
    .flash-steam { animation: flashSteam 1.8s infinite ease-in-out; }
    .gazelle-eyes { animation: gazelleBlink 4s infinite; transform-origin: center 80px; }
    .gazelle-ear { animation: gazelleEarTwitch 3.5s infinite; transform-origin: 85px 75px; }

    .grammar-accordion > summary::-webkit-details-marker { display: none; }
    .grammar-accordion[open] .accordion-chevron { transform: rotate(45deg); }
    .grammar-accordion summary:focus-visible { outline: 3px solid #1cb0f6; outline-offset: -3px; }
    /* ending highlight (grammar) */
    .end-mark { font-weight: 800; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 7px; border-radius: 4px; }
    /* gazelle chat */
    .gz-mascot-click { cursor: pointer; transition: transform .15s; }
    .gz-mascot-click:hover { transform: scale(1.06) rotate(-2deg); }
    #gz-panel { box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .gz-bubble strong { font-weight: 800; }
    @keyframes gzDots { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
    .gz-dot { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:#999; animation: gzDots 1.2s infinite; }
    .gz-dot:nth-child(2){ animation-delay:.2s } .gz-dot:nth-child(3){ animation-delay:.4s }
  </style>
</head>
<body class="bg-white text-[#3c3c3c] selection:bg-[#d7ffb8]">
  <div id="app"></div>
  <!-- Persistent Session Overlay Container so Progress Bar slides smoothly -->
  <div id="session-overlay-root"></div>

  <script>
    // ============================================================================
    // UTILITIES, SHUFFLING & AUDIO ENGINE
    // ============================================================================
    function stripTashkeel(text) {
      if (!text) return '';
      return String(text)
        .replace(/[\u064B-\u065F\u0670]/g, '')
        .replace(/[،؟!.\-]/g, '')
        .trim();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Fisher-Yates shuffle that guarantees the array is NEVER in its original order
    function shuffleDerangement(arr) {
      if (!arr || arr.length <= 1) return arr ? arr.slice() : [];
      const originalJoin = arr.map(function(x) { return typeof x === 'object' ? JSON.stringify(x) : String(x); }).join('||');
      let copy = arr.slice();
      for (let attempt = 0; attempt < 12; attempt++) {
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;
        }
        const currentJoin = copy.map(function(x) { return typeof x === 'object' ? JSON.stringify(x) : String(x); }).join('||');
        if (currentJoin !== originalJoin) break;
      }
      // If still identical, swap first two elements
      const finalJoin = copy.map(function(x) { return typeof x === 'object' ? JSON.stringify(x) : String(x); }).join('||');
      if (finalJoin === originalJoin && copy.length >= 2) {
        const t = copy[0];
        copy[0] = copy[1];
        copy[1] = t;
      }
      return copy;
    }

    function speakArabic(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ar-SA';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    function playCorrectSound() {
      const audio = new Audio('Duolingo Correct Sound Effect.mp3');
      audio.volume = 0.9;
      audio.play().catch(function() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'triangle';
          osc1.frequency.setValueAtTime(587.33, now);
          gain1.gain.setValueAtTime(0.35, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
          osc1.connect(gain1); gain1.connect(ctx.destination);
          osc1.start(now); osc1.stop(now + 0.14);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'triangle';
          osc2.frequency.setValueAtTime(880.0, now + 0.11);
          gain2.gain.setValueAtTime(0.4, now + 0.11);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
          osc2.connect(gain2); gain2.connect(ctx.destination);
          osc2.start(now + 0.11); osc2.stop(now + 0.55);
        } catch (e) {}
      });
    }

    function playIncorrectSound() {
      const audio = new Audio('Duolingo Incorrect Answer sound effect.mp3');
      audio.volume = 0.9;
      audio.play().catch(function() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(246.94, now);
          gain1.gain.setValueAtTime(0.25, now);
          gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc1.connect(gain1); gain1.connect(ctx.destination);
          osc1.start(now); osc1.stop(now + 0.18);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(174.61, now + 0.15);
          gain2.gain.setValueAtTime(0.3, now + 0.15);
          gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc2.connect(gain2); gain2.connect(ctx.destination);
          osc2.start(now + 0.15); osc2.stop(now + 0.5);
        } catch (e) {}
      });
    }

    function playVictorySound() {
      const audio = new Audio('Victory Sound Effect.mp3');
      audio.volume = 0.95;
      audio.play().catch(function() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach(function(freq, idx) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            const startTime = now + idx * 0.12;
            const duration = idx === notes.length - 1 ? 0.7 : 0.15;
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.35, startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(startTime); osc.stop(startTime + duration);
          });
        } catch (e) {}
      });
    }

    function getTopicFlashIconHTML(unitIndex, isLocked) {
      if (isLocked) {
        return `<svg viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`;
      }
      const strokeColor = "#ffffff";
      const accentColor = "#ffc800";
      switch (unitIndex % 10) {
        case 0:
          return `<svg viewBox="0 0 48 48" class="w-10 h-10 relative z-10 overflow-visible"><path d="M18 11 Q18 6 21 6" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" fill="none" class="flash-steam" /><path d="M26 11 Q26 6 29 6" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" fill="none" class="flash-steam" style="animation-delay:0.5s" /><path d="M11 16 H33 V28 C33 34 28 38 22 38 C16 38 11 34 11 28 Z" fill="${strokeColor}" /><path d="M33 19 H37 C39.5 19 41 21 41 23.5 C41 26 39.5 28 37 28 H33" stroke="${strokeColor}" stroke-width="3.5" fill="none" /></svg>`;
        case 1:
          return `<svg viewBox="0 0 48 48" class="w-10 h-10 relative z-10 flash-pulse"><path d="M10 12 H38 C40 12 42 14 42 16 V30 C42 32 40 34 38 34 H20 L12 40 V34 H10 C8 34 6 32 6 30 V16 C6 14 8 12 10 12 Z" fill="${strokeColor}" /><text x="24" y="29" text-anchor="middle" fill="#1cb0f6" font-size="18" font-weight="900" class="font-arabic">ـًا</text></svg>`;
        case 2:
          return `<svg viewBox="0 0 48 48" class="w-10 h-10 relative z-10 flash-wiggle"><rect x="11" y="8" width="22" height="30" rx="3" fill="${strokeColor}" /><line x1="16" y1="15" x2="28" y2="15" stroke="#ce82ff" stroke-width="3" stroke-linecap="round" /><line x1="16" y1="22" x2="28" y2="22" stroke="#ce82ff" stroke-width="3" stroke-linecap="round" /><path d="M32 14 L39 21 L27 33 L20 33 L20 26 Z" fill="${accentColor}" /></svg>`;
        case 3:
          return `<svg viewBox="0 0 48 48" class="w-10 h-10 relative z-10 flash-float"><circle cx="24" cy="24" r="15" stroke="${strokeColor}" stroke-width="4" fill="none" /><polyline points="24 15 24 24 30 27" stroke="${accentColor}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
        case 4:
          return `<svg viewBox="0 0 48 48" class="w-10 h-10 relative z-10 flash-wiggle"><circle cx="24" cy="24" r="16" fill="${strokeColor}" /><text x="24" y="32" text-anchor="middle" fill="#ff4b4b" font-size="26" font-weight="900" class="font-arabic">؟</text></svg>`;
        case 5:
          return `<svg viewBox="0 0 48 48" class="w-10 h-10 relative z-10 flash-pulse"><circle cx="24" cy="26" r="12" fill="${strokeColor}" /><path d="M24 14 Q28 8 33 11 Q29 15 24 14 Z" fill="${accentColor}" /></svg>`;
        case 6:
          return `<svg viewBox="0 0 48 48" class="w-10 h-10 relative z-10 flash-float"><rect x="12" y="10" width="24" height="24" rx="5" fill="${strokeColor}" /><rect x="16" y="15" width="16" height="8" rx="2" fill="#1cb0f6" /><circle cx="18" cy="29" r="2.5" fill="#1cb0f6" /><circle cx="30" cy="29" r="2.5" fill="#1cb0f6" /><line x1="10" y1="38" x2="38" y2="38" stroke="${accentColor}" stroke-width="3.5" stroke-linecap="round" /></svg>`;
        case 7:
          return `<svg viewBox="0 0 48 48" class="w-10 h-10 relative z-10 flash-float"><polygon points="24 10 6 19 24 28 42 19 24 10" fill="${strokeColor}" /><path d="M13 23 V32 C13 35 18 38 24 38 C30 38 35 35 35 32 V23" stroke="${strokeColor}" stroke-width="3.5" fill="none" /><line x1="40" y1="20" x2="40" y2="31" stroke="${accentColor}" stroke-width="3" stroke-linecap="round" /></svg>`;
        case 8:

      const q = stripTashkeel(query);
      if (!q) return null;
      for (let i = 0; i < VERB_CONJUGATION_DB.length; i++) {
        const v = VERB_CONJUGATION_DB[i];
        if (stripTashkeel(v.lemma).indexOf(q) !== -1 || v.root.replace(/\./g, '').indexOf(q) !== -1 || v.meaning.indexOf(q) !== -1) {
          return v;
        }
        const allForms = Object.values(v.forms.past)
          .concat(Object.values(v.forms.present))
          .concat(Object.values(v.forms.subjunctive));
        for (let j = 0; j < allForms.length; j++) {
          const f = allForms[j];
          if (stripTashkeel(f) === q || stripTashkeel(f.replace(/^أَنْ\s+/, '')) === q) return v;
        }
      }
      return null;
    }

    // Find Matching Nouns & Adjectives (with Masculine, Feminine, Dual, Plural!)
    function findMatchedNounsAndAdjectives(query) {
      const q = stripTashkeel(query);
      if (!q) return [];
      return CATEGORIZED_VOCABULARY.filter(function(item) {
        return (
          stripTashkeel(item.ar).indexOf(q) !== -1 ||
          stripTashkeel(item.plural).indexOf(q) !== -1 ||
          stripTashkeel(item.fem).indexOf(q) !== -1 ||
          stripTashkeel(item.dual).indexOf(q) !== -1 ||
          item.he.indexOf(q) !== -1
        );
      }).slice(0, 6);
    }

    window.openUnitGuidebook = function(unitId) {

    window.clickNode = function(unitId, nodeId) {
      const unit = state.units.find(function(u) { return u.id === unitId; });
      if (!unit) return;
      const node = unit.nodes.find(function(n) { return n.id === nodeId; });
      if (!node) return;
      if (node.status === 'locked') {
        playIncorrectSound();
        return;
      }
      // Deep copy and freshly shuffle options/words every time a node is opened!
      const freshQuestions = node.questions.map(function(q) {
        const copyQ = Object.assign({}, q);
        if (copyQ.type === 'multiple_choice' || copyQ.type === 'irab_detective') {
          copyQ.options = shuffleDerangement(copyQ.options);
        } else if (copyQ.type === 'sentence_builder') {
          copyQ.words = shuffleDerangement(copyQ.correctOrder.concat(
            copyQ.words.filter(function(w) { return copyQ.correctOrder.indexOf(w) === -1; })
          ));
        } else if (copyQ.type === 'matching') {
          copyQ.shuffledHe = shuffleDerangement(copyQ.pairs.slice());
        }
        return copyQ;
      });

      state.activeSession = {
        unit: unit,
        node: Object.assign({}, node, { questions: freshQuestions }),
        showingIntro: !!SYN_INTROS[node.id],
        qIndex: 0
      };
      state.selectedOption = '';
      state.assembledWords = [];
      state.matchedPairs = [];
      state.selectedArMatch = null;
      state.selectedHeMatch = null;
      state.feedback = null;
      state.hintOpen = false;
      renderSessionOverlay();
    };


    // ============================================================================
    // SKIP A UNIT: a challenging summary test (80% needed). Passing completes the unit.
    // ============================================================================
    function freshenQuestions(list) {
      return list.map(function(q) {
        const c = Object.assign({}, q);
        if (c.type === 'multiple_choice' || c.type === 'irab_detective') c.options = shuffleDerangement(c.options);
        else if (c.type === 'sentence_builder') c.words = shuffleDerangement(c.correctOrder.concat(c.words.filter(function(w) { return c.correctOrder.indexOf(w) === -1; })));
        else if (c.type === 'matching') c.shuffledHe = shuffleDerangement(c.pairs.slice());
        return c;
      });
    }
    window.startUnitTest = function(unitId) {
      const unit = state.units.find(function(u) { return u.id === unitId; });
      if (!unit || !unit.test || !unit.test.length) return;
      state.testResult = null;
      state.activeSession = { unit: unit, node: { id: unit.id + '-test', title: 'מבחן מסכם לדילוג', questions: freshenQuestions(unit.test) }, showingIntro: true, qIndex: 0, isTest: true, correct: 0 };
      state.selectedOption = ''; state.assembledWords = []; state.matchedPairs = []; state.selectedArMatch = null; state.selectedHeMatch = null; state.feedback = null; state.hintOpen = false;
      renderSessionOverlay();
    };
    function finishUnitTest(sess) {
      const total = sess.node.questions.length, need = Math.ceil(total * 0.8);
      state.activeSession = null;
      if (sess.correct >= need) {
        const idx = state.units.findIndex(function(u) { return u.id === sess.unit.id; });
        state.units[idx].nodes.forEach(function(n) { n.status = 'completed'; });
        state.units.forEach(function(u) { if (u.nodes[0] && u.nodes[0].status === 'locked') u.nodes[0].status = 'active'; });
        saveUnitsState(); playVictorySound();
        showToast('כל היחידות נפתחו! אפשר לבחור כל יחידה במסלול.');
        state.victoryModalUnit = state.units[idx];
      } else {
        playIncorrectSound();
        state.testResult = { unit: sess.unit, correct: sess.correct, total: total, need: need };
      }
      renderSessionOverlay(); renderApp();
    }
    window.closeTestResult = function() { state.testResult = null; renderApp(); };

    window.selectMatchingItem = function(side, arWord) {
      if (state.matchedPairs.indexOf(arWord) !== -1) return;
      if (side === 'ar') {
        state.selectedArMatch = arWord;
        speakArabic(arWord);
        if (state.selectedHeMatch) {
          if (state.selectedHeMatch === arWord) {
            state.matchedPairs.push(arWord);
            playCorrectSound();
          } else {
            playIncorrectSound();
          }
          state.selectedArMatch = null;
          state.selectedHeMatch = null;
        }
      } else {
        state.selectedHeMatch = arWord;
        if (state.selectedArMatch) {
          if (state.selectedArMatch === arWord) {
            state.matchedPairs.push(arWord);
            playCorrectSound();
            speakArabic(arWord);
          } else {
            playIncorrectSound();
          }
          state.selectedArMatch = null;
          state.selectedHeMatch = null;
        }
      }
      renderSessionOverlay();
    };

    window.checkCurrentAnswer = function() {
      if (!state.activeSession) return;
      const q = state.activeSession.node.questions[state.activeSession.qIndex];
      let isCorrect = false;
      if (q.type === 'multiple_choice') {
        isCorrect = state.selectedOption === q.correctAnswer;
      } else if (q.type === 'irab_detective' || q.type === 'word_tap') {
        isCorrect = state.selectedOption === q.correctValue;
      } else if (q.type === 'sentence_builder') {
        isCorrect = state.assembledWords.join(' ') === q.correctOrder.join(' ');
      } else if (q.type === 'matching') {
        isCorrect = state.matchedPairs.length === q.pairs.length;
      }

      if (isCorrect && state.activeSession.isTest) state.activeSession.correct++;
      if (isCorrect) {
        playCorrectSound();
        state.feedback = {
          isCorrect: true,
          message: 'مُمْتَاز! بِالضَّبْط! (מצוין! בדיוק!)',
          tip: q.grammarTip
        };
      } else {
        playIncorrectSound();
        const rightText = q.type === 'multiple_choice'
          ? q.correctAnswer
          : (q.type === 'irab_detective' || q.type === 'word_tap')
            ? q.correctValue
            : (q.correctOrder ? q.correctOrder.join(' ') : '');
        state.feedback = {
          isCorrect: false,
          message: 'לא מדויק. התשובה הנכונה: ' + rightText,
          tip: q.grammarTip
        };
      }
      renderSessionOverlay();
    };

    window.nextSessionQuestion = function() {
      if (!state.activeSession) return;
      const questions = state.activeSession.node.questions;
      if (state.activeSession.qIndex + 1 < questions.length) {
        state.activeSession.qIndex++;
        state.hintOpen = false;
        state.selectedOption = '';
        state.assembledWords = [];
        state.matchedPairs = [];
        state.selectedArMatch = null;
        state.selectedHeMatch = null;
        state.feedback = null;
        renderSessionOverlay();
      } else if (state.activeSession.isTest) {
        finishUnitTest(state.activeSession);
      } else {
        playVictorySound();
        unlockNextNodeInSequence(state.activeSession.unit.id, state.activeSession.node.id);
        const finishedUnit = state.activeSession.unit;
        state.activeSession = null;
        state.victoryModalUnit = finishedUnit;
        renderSessionOverlay();
        renderApp();
      }
    };

    function unlockNextNodeInSequence(completedUnitId, completedNodeId) {
      const flat = [];
      state.units.forEach(function(u, uIdx) {
        u.nodes.forEach(function(n, nIdx) {
          flat.push({ uIdx: uIdx, nIdx: nIdx, unitId: u.id, nodeId: n.id });
        });
      });
      const currentPos = flat.findIndex(function(item) {
        return item.unitId === completedUnitId && item.nodeId === completedNodeId;
      });
      const nextPos = currentPos + 1 < flat.length ? flat[currentPos + 1] : null;

      state.units.forEach(function(u, uIdx) {
        u.nodes.forEach(function(n, nIdx) {
          if (u.id === completedUnitId && n.id === completedNodeId) {
            n.status = 'completed';
          }
          if (nextPos && uIdx === nextPos.uIdx && nIdx === nextPos.nIdx && n.status === 'locked') {
            n.status = 'active';
          }
        });
      });
      saveUnitsState();
    }

    // ============================================================================

        html += `

            <div class="px-3.5 py-2 bg-[#fff5d3] border-b-2 border-[#ffc800] text-[11px] font-extrabold text-[#8c4103]">

      // 2. If Nouns or Adjectives are matched -> Show Vocalized Table: Masculine, Feminine, Dual, Plural!

        html += `
          <div class="mt-3 bg-white rounded-2xl border-2 border-[#e5e5e5] overflow-hidden shadow-sm">

              <span class="font-extrabold text-xs text-[#58a700]">📌 נטיות שמות עצם ותארים (יחיד, נקבה, זוגי ורבים מנוקדים):</span>

    // Compact, independent result for the side-column quick search.
    function renderQuickLookup(containerId, queryStr) {
      const el = document.getElementById(containerId);
      if (!el) return;
      const q = (queryStr || '').trim();
      if (!q) { el.innerHTML = ''; return; }
      const verb = findMatchedVerb(q);
      const nominals = findMatchedNounsAndAdjectives(q).slice(0, 3);
      let html = '';

        const f = verb.forms;

          <div class="flex items-center justify-between gap-2"><button onclick="speakArabic('${escapeHtml(verb.lemma)}')" class="font-arabic text-xl font-bold text-[#3c3c3c] hover:text-[#1cb0f6]">${escapeHtml(verb.lemma)} 🔊</button><span class="text-xs font-extrabold text-[#4b4b4b]">${escapeHtml(verb.meaning)}</span></div>

          <div class="grid grid-cols-2 gap-x-3 gap-y-0.5 text-[11px] font-bold text-[#777777]">

            <span>הוא, עבר: <strong class="font-arabic text-base text-[#3c3c3c]">${escapeHtml(f.past.huwa)}</strong></span><span>הוא, הווה: <strong class="font-arabic text-base text-[#1453a3]">${escapeHtml(f.present.huwa)}</strong></span>
          </div></div>`;
      }
      nominals.forEach(function(item) {
        const forms = [['נקבה', item.fem], ['זוגי', item.dual], ['רבים', item.plural]].filter(function(x) { return x[1] && x[1] !== '-'; });
        html += `<div class="rounded-xl bg-white border-2 border-[#e5e5e5] p-3">
          <div class="flex items-center justify-between gap-2"><button onclick="speakArabic('${escapeHtml(item.ar)}')" class="font-arabic text-xl font-bold text-[#3c3c3c] hover:text-[#1cb0f6]">${escapeHtml(item.ar)} 🔊</button><span class="text-xs font-extrabold text-[#4b4b4b] text-left">${escapeHtml(item.he)}</span></div>
          ${forms.length ? `<div class="flex flex-wrap gap-x-3 text-[11px] font-bold text-[#777777]">${forms.map(function(x) { return `<span>${x[0]}: <strong class="font-arabic text-base text-[#3c3c3c]">${escapeHtml(x[1])}</strong></span>`; }).join('')}</div>` : ''}
          ${elativeLineHtml(item)}</div>`;
      });
      if (!verb && !nominals.length) html += `<div class="text-xs font-extrabold text-[#4b4b4b]">לא נמצא במאגר של הקורס.</div>`;
      const linkWord = verb ? verb.lemma : (nominals[0] ? nominals[0].ar : stripTashkeel(q));
      html += `<div class="pt-1">${dictLinksHtml(linkWord, true)}</div>
        <button onclick="submitWikiSearch()" class="duo-btn-blue w-full py-2 rounded-xl font-extrabold text-xs">הרחבה במילון המלא ←</button>`;
      el.innerHTML = html;
    }

    function dictItemMatches(item, q, sq) {
      if (!q) return true;
      if (item.isVerb) return stripTashkeel(item.ar).indexOf(sq) !== -1 || item.root.replace(/\./g, '').indexOf(sq) !== -1 || item.he.indexOf(q) !== -1;
      return stripTashkeel(item.ar).indexOf(sq) !== -1 || stripTashkeel(item.plural).indexOf(sq) !== -1 ||
        stripTashkeel(item.fem).indexOf(sq) !== -1 || stripTashkeel(item.dual).indexOf(sq) !== -1 || item.he.indexOf(q) !== -1;
    }
    function dictItemInNav(item) {
      if (state.dictMode === 'pos') return state.selectedPos === 'הכל' || posOf(item) === state.selectedPos;
      return state.selectedVocabCategory === 'הכל' || item.category === state.selectedVocabCategory;
    }

    function renderVocabListOnly() {
      const listEl = document.getElementById('vocab-items-container');
      if (!listEl) return;
      const q = state.dictSearch.trim(); const sq = stripTashkeel(q);
      const filtered = getDictItems().filter(function(item) { return dictItemInNav(item) && dictItemMatches(item, q, sq); });
      const shown = filtered.slice(0, state.dictLimit);
      const countEl = document.getElementById('vocab-count-badge');
      if (countEl) countEl.textContent = filtered.length + ' תוצאות';
      const extLinks = q ? `<div class="pt-1 space-y-1"><p class="text-xs font-extrabold text-[#777777]">חיפוש "${escapeHtml(q)}" במילונים חיצוניים:</p>${dictLinksHtml(sq, false)}</div>` : '';
      if (!filtered.length) {
        listEl.innerHTML = `<div class="p-6 rounded-2xl border-2 border-dashed border-[#e5e5e5] text-center space-y-2"><p class="font-extrabold text-[#777777]">לא נמצאה מילה כזו באוצר המילים של הקורס${(state.dictMode === 'pos' ? state.selectedPos !== 'הכל' : state.selectedVocabCategory !== 'הכל') ? ' בקטגוריה שנבחרה' : ''}.</p>${extLinks}</div>`;
        return;
      }
      listEl.innerHTML = shown.map(function(item) {
        const forms = item.isVerb ? [] : [['נקבה', item.fem, '#1453a3'], ['זוגי', item.dual, '#6f4ea1'], ['רבים', item.plural, '#58a700']].filter(function(f) { return f[1] && f[1] !== '-'; });
        const verbLine = item.isVerb ? `<div class="flex flex-wrap items-center gap-2 mt-1"><span class="px-2 py-0.5 rounded-lg bg-[#e5e5e5] text-[#4b4b4b] font-extrabold text-[11px]">שורש: ${escapeHtml(item.root)}</span><span style="background-color:${item.binyanBadgeColor || '#777'}" class="px-2 py-0.5 rounded-lg text-white font-extrabold text-[11px]">${escapeHtml(item.binyan)}</span><button onclick="selectVerbChip('${escapeHtml(item.ar)}')" class="duo-btn-blue px-3 py-1 rounded-xl font-extrabold text-[11px]">לוח נטיות מלא</button></div>` : '';
        return `
          <div class="p-3.5 rounded-2xl border-2 border-[#e5e5e5] flex items-start gap-3 hover:bg-[#f7f7f7] transition-colors">
            <button onclick="speakArabic('${escapeHtml(item.ar)}')" title="השמעה" class="w-10 h-10 rounded-xl bg-[#ddf4ff] text-[#1cb0f6] flex items-center justify-center shrink-0">🔊</button>
            <div class="flex-1 min-w-0">
              <div class="flex flex-wrap items-baseline gap-x-3"><span class="font-arabic text-2xl font-bold text-[#3c3c3c]" dir="rtl">${escapeHtml(item.ar)}</span><span class="text-sm font-bold text-[#777777]">${escapeHtml(item.he)}</span></div>
              ${verbLine}
              ${forms.length ? `<div class="flex flex-wrap gap-x-3 text-xs font-bold text-[#777777] mt-0.5">${forms.map(function(f) { return `<span>${f[0]}: <strong class="font-arabic text-base" style="color:${f[2]}">${escapeHtml(f[1])}</strong></span>`; }).join('')}</div>` : ''}
              ${elativeLineHtml(item)}
              <div class="mt-2">${dictLinksHtml(item.ar, true)}</div>
            </div>
            <div class="hidden sm:flex flex-col items-end gap-1 shrink-0"><span class="px-2 py-0.5 rounded-lg bg-[#f7f7f7] text-[#afafaf] font-extrabold text-[10px]">${escapeHtml(item.category)}</span><span class="px-2 py-0.5 rounded-lg bg-[#f3e8ff] text-[#6f4ea1] font-extrabold text-[10px]">${escapeHtml(posOf(item))}</span></div>
          </div>`;
      }).join('') + (filtered.length > shown.length ? `<button onclick="state.dictLimit += 80; renderVocabListOnly()" class="duo-btn-outline w-full py-3 rounded-2xl font-extrabold text-sm">הצג עוד (${filtered.length - shown.length})</button>` : '') + (q ? extLinks : '');
    }

    window.addCustomWord = function(event) {
      event.preventDefault();
      const ar = document.getElementById('new-word-ar').value.trim();
      const he = document.getElementById('new-word-he').value.trim();
      const category = document.getElementById('new-word-category').value;
      const feedback = document.getElementById('add-word-feedback');
      const duplicate = CATEGORIZED_VOCABULARY.find(function(v){return stripTashkeel(v.ar).toLowerCase() === stripTashkeel(ar).toLowerCase();});
      if (duplicate) { feedback.textContent = 'המילה כבר קיימת במאגר: ' + duplicate.ar + ' — ' + duplicate.he + '. לא נוספה כפילות.'; feedback.className='text-sm font-bold text-[#ff4b4b]'; return; }
      const item = {ar:ar,he:he,category:category,plural:'-',fem:'-',dual:'-'};
      CATEGORIZED_VOCABULARY.push(item);
      try { const current = JSON.parse(localStorage.getItem('dawalingo_custom_vocab') || '[]'); current.push(item); localStorage.setItem('dawalingo_custom_vocab',JSON.stringify(current)); } catch(e) {}
      feedback.textContent = 'נוסף בהצלחה למילון!'; feedback.className='text-sm font-bold text-[#58a700]';
      document.getElementById('new-word-ar').value=''; document.getElementById('new-word-he').value='';
    };

      const common = { 'و': 'ו־', 'أَنَا': 'אני', 'هُوَ': 'הוא', 'هِيَ': 'היא', 'مِنْ': 'מן', 'إِلَى': 'אל', 'فِي': 'ב־', 'عَلَى': 'על', 'مَعَ': 'עם', 'لَا': 'לא', 'لَمْ': 'לא (עבר)', 'لَنْ': 'לא (עתיד)', 'هَلْ': 'האם', 'مَا': 'מה / לא', 'كَانَ': 'היה', 'لَيْسَ': 'אינו / איננה', 'لِأَنَّ': 'כי', 'لَكِنْ': 'אבל', 'ثُمَّ': 'ואז', 'شُكْرًا': 'תודה', 'نَعَمْ': 'כן', 'جِدًّا': 'מאוד', 'غَدًا': 'מחר', 'أَمْسِ': 'אתמול' };
      const key = Object.keys(common).find(function(k) { return stripTashkeel(k) === norm; });
      state.story.wordTip = { word: word.replace(/[،؟.!,]/g, ''), he: vocab ? vocab.he : (key ? common[key] : 'אין תרגום נפרד במילון (אפשר לחפש במילון)') };
      renderApp();
    };
    window.storyPick = function(idx) { const st = state.story; if (st.fb) return; st.sel = idx; renderApp(); };
    window.storyAdd = function(idx) { const st = state.story; if (st.fb) return; const w = st.steps[st.i].w[idx]; if (st.picked.indexOf(idx) === -1) { st.picked.push(idx); speakArabic(w); renderApp(); } };
    window.storyRemove = function(pos) { const st = state.story; if (st.fb) return; st.picked.splice(pos, 1); renderApp(); };
    window.storyCheck = function() {
      const st = state.story; const cur = st.steps[st.i]; let ok = false;
      if (cur.k === 'q') ok = cur.o[st.sel] === cur.right;
      else ok = st.picked.map(function(p) { return cur.w[p]; }).join(' ') === cur.a.join(' ');
      st.asked++; if (ok) st.correct++;
      ok ? playCorrectSound() : playIncorrectSound();
      st.fb = { ok: ok, right: cur.k === 'q' ? cur.right : cur.a.join(' ') };
      renderApp();
    };
    window.storyNext = function() {
      const st = state.story;
      st.i++; st.sel = null; st.picked = []; st.fb = null; st.wordTip = null;
      if (st.i >= st.steps.length) { playVictorySound(); st.done = true; }

      renderApp();

      } else if (state.activeNav === 'grammar') {

          return `<div class="space-y-1.5"><div class="text-[11px] font-extrabold text-[#8c4103]">${escapeHtml(g.name)}</div><div class="flex flex-wrap gap-1.5">${g.items.map(function(i) {
            const t = GRAMMAR_ENCYLOPEDIA[i];
            return `<button onclick="scrollToGrammar('gr-topic-${i + 1}')" class="px-2.5 py-1 rounded-xl border-2 border-[#e5e5e5] bg-white hover:bg-[#f7f7f7] text-xs font-extrabold text-[#4b4b4b] text-right"><span style="color:${t.color}">${i + 1}.</span> ${escapeHtml(shortGrammarTitle(t.title))}</button>`;
          }).join('')}</div></div>`;
        }).join('');
        mainContentHtml = `
          <div class="space-y-4 pb-24">
            <div class="p-6 rounded-2xl bg-[#fff5d3] border-2 border-[#ffc800] flex items-center justify-between gap-4">
              <div>
                <span class="inline-block px-2.5 py-0.5 rounded-md bg-[#ffc800] text-[#8c4103] font-extrabold text-xs mb-2">מדור דקדוק מרוכז • قَوَاعِد اللُّغَة العَرَبِيَّة</span>
                <h2 class="text-2xl font-extrabold text-[#3c3c3c]">כללי הדקדוק וסיכומי הקורס</h2>
                <p class="text-sm text-[#4b4b4b] mt-1">חלק הדיבר = סוג המילה (שם עצם, פועל, תואר או מילת יחס). תפקיד תחבירי = התפקיד של המילה במשפט (נושא, נשוא, מבצע, מושא, שם אחרי מילת יחס או סמיכות). אותה מילה מקבלת תנועה שונה בסוף לפי התפקיד שלה: נושא ← דמה (ـُ), מושא ישיר ← פתחה (ـَ), אחרי מילת יחס ← כסרה (ـِ). קודם מזהים את התפקיד במשפט, ורק אחר כך מנקדים.</p>
              </div>
              ${getGazelleMascotHTML("w-24 h-28 shrink-0")}
            </div>
            <div class="p-5 rounded-2xl border-2 border-[#e5e5e5] bg-[#f7f7f7] space-y-3"><h3 class="font-extrabold text-[#3c3c3c]">תוכן עניינים</h3><div class="space-y-3">${tocHtml}</div></div>
            ${cardsHtml}
          </div>
        `;
      } else if (state.activeNav === 'dictionary') {
        const allItems = getDictItems();
        const topicCats = ['הכל'].concat(Array.from(new Set(allItems.map(function(v) { return v.category; }))));
        const posCats = ['הכל'].concat(POS_ORDER.filter(function(p) { return allItems.some(function(i) { return posOf(i) === p; }); }));
        const chip = function(label, active, fn, cnt) {
          return `<button onclick="${fn}('${escapeHtml(label)}')" class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${active ? 'duo-btn-selected' : 'duo-btn-outline'}">${escapeHtml(label)} <span class="opacity-60">${cnt}</span></button>`;
        };
        const navChips = state.dictMode === 'pos'
          ? posCats.map(function(c) { return chip(c, state.selectedPos === c, 'setPos', c === 'הכל' ? allItems.length : allItems.filter(function(i) { return posOf(i) === c; }).length); }).join('')
          : topicCats.map(function(c) { return chip(c, state.selectedVocabCategory === c, 'setVocabCat', c === 'הכל' ? allItems.length : allItems.filter(function(i) { return i.category === c; }).length); }).join('');
        mainContentHtml = `
          <div class="space-y-4 pb-20">
            <div class="p-5 rounded-2xl bg-[#ddf4ff] border-2 border-[#84d8ff] space-y-3">
              <div class="flex items-center justify-between gap-3">
                <div><span class="text-xs font-extrabold uppercase text-[#1cb0f6]">לוח נטיות חכם</span>
                <h2 class="text-2xl font-extrabold text-[#3c3c3c]">מילון (قَامُوس)</h2>
                <p class="text-sm font-bold text-[#4b4b4b] mt-0.5">מקלידים פועל, שם עצם או תואר בערבית או בעברית: מקבלים תרגום, נטיות הפועל והשם, יתרון והפלגה לתארים, וקישורים ל-Wiktionary ולמילון מילסון.</p></div>
                ${getGazelleMascotHTML("w-16 h-20 shrink-0")}
              </div>
              <input id="dict-search-input" type="text" value="${escapeHtml(state.dictSearch)}" oninput="handleDictSearchInput(this.value)" placeholder="חיפוש מילה בערבית או בעברית..." class="w-full px-4 py-3.5 rounded-2xl border-2 border-[#84d8ff] bg-white font-bold text-lg focus:outline-none focus:border-[#1cb0f6]" dir="auto" />
              <div class="flex flex-wrap gap-1.5 items-center">
                <span class="text-[11px] font-extrabold text-[#777777] ml-1">דוגמאות ללחיצה מהירה:</span>
                ${getQuickChipsHtml()}
                <button onclick="selectVerbChip('')" class="text-xs font-extrabold text-[#ff4b4b] hover:underline mr-2">נקה ✕</button>
                ${kbIconButton()}
              </div>
            </div>
            <div id="dict-morph-results"></div>
            <div class="p-4 rounded-2xl border-2 border-[#e5e5e5] bg-white space-y-3">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-extrabold text-[#777777]">עיון לפי:</span>
                <button onclick="setDictMode('topic')" class="px-4 py-1.5 rounded-xl text-sm font-extrabold ${state.dictMode === 'topic' ? 'duo-btn-selected' : 'duo-btn-outline'}">🗂️ נושאים</button>
                <button onclick="setDictMode('pos')" class="px-4 py-1.5 rounded-xl text-sm font-extrabold ${state.dictMode === 'pos' ? 'duo-btn-selected' : 'duo-btn-outline'}">🔤 חלקי דיבר</button>
                <span id="vocab-count-badge" class="px-3 py-1 rounded-full bg-[#58cc02]/15 text-[#58a700] font-extrabold text-xs mr-auto"></span>
              </div>
              <div class="flex flex-wrap gap-1.5">${navChips}</div>
            </div>
            <div id="vocab-items-container" class="space-y-2"></div>
            <details class="rounded-2xl border-2 border-[#e5e5e5] bg-white p-4"><summary class="cursor-pointer font-extrabold text-sm text-[#1cb0f6]">➕ הוספת מילה חדשה או סריקת סיכום</summary><div class="pt-4">${addWordsHtml}</div></details>
          </div>
        `;
      } else if (state.activeNav === 'stories') {
        mainContentHtml = renderStoriesTab();
      } else if (state.activeNav === 'forum') {
        mainContentHtml = renderForumTab();
      }

      // Modals HTML (Guidebook & Victory Modal)
      let modalsHtml = '';

      if (state.activeGuidebook) {
        const u = state.activeGuidebook;
        modalsHtml += `
          <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-xl rounded-3xl border-2 border-[#e5e5e5] shadow-2xl overflow-hidden flex flex-col">
              <div style="background-color:${u.color}" class="p-6 text-white flex items-center justify-between">
                <div>
                  <span class="text-xs font-extrabold uppercase text-white/90">${escapeHtml(u.unitNumber)} • ${escapeHtml(u.sectionTitle)}</span>
                  <h2 class="text-xl sm:text-2xl font-extrabold">${escapeHtml(u.title)}</h2>
                </div>
                <button onclick="closeUnitGuidebook()" class="w-10 h-10 rounded-full bg-black/15 hover:bg-black/25 text-white font-extrabold">✕</button>
              </div>
              <div class="p-6 space-y-4">
                <h3 class="text-lg font-extrabold text-[#3c3c3c]">כלל המפתח והמילים של היחידה:</h3>
                ${u.ruleSummary ? `<div class="p-4 rounded-2xl bg-[#fff5d3] border-2 border-[#ffc800] font-bold text-sm text-[#8c4103] leading-relaxed">
                  💡 ${escapeHtml(u.ruleSummary)}
                </div>` : ''}
                ${(u.words && u.words.length) ? `<h3 class="text-sm font-extrabold text-[#3c3c3c] pt-1">המילים ביחידה (${u.words.length}):</h3><div class="flex flex-wrap gap-2 max-h-56 overflow-y-auto">${u.words.map(function(w) { return `<button onclick="speakArabic('${escapeHtml(w.ar)}')" class="px-3 py-1.5 rounded-xl border-2 border-[#e5e5e5] bg-white hover:bg-[#f7f7f7]"><span class="font-arabic text-lg font-bold">${escapeHtml(w.ar)}</span> <span class="text-xs font-bold text-[#777777]">${escapeHtml(w.he)}</span></button>`; }).join('')}</div>` : ''}
              </div>
              <div class="p-4 border-t-2 border-[#e5e5e5] bg-white flex justify-end">
                <button onclick="closeUnitGuidebook()" class="duo-btn-green px-8 py-3 rounded-2xl font-extrabold text-sm">סגור חוברת הדרכה</button>
              </div>
            </div>
          </div>
        `;
      }

      if (state.testResult) {
        const tr = state.testResult;
        modalsHtml += `
          <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-3xl border-2 border-[#ff4b4b] p-6 text-center space-y-4 shadow-2xl">
              <h2 class="text-2xl font-extrabold text-[#3c3c3c]">עוד לא עברתם את המבחן</h2>
              <p class="text-sm font-bold text-[#777777]">${escapeHtml(tr.unit.title)}</p>
              <p class="font-extrabold text-lg">ענית נכון על ${tr.correct} מתוך ${tr.total}. כדי לדלג צריך ${tr.need} לפחות.</p>
              <div class="flex gap-3"><button onclick="startUnitTest('${tr.unit.id}')" class="duo-btn-green flex-1 py-3 rounded-2xl font-extrabold text-sm">ניסיון נוסף</button><button onclick="closeTestResult()" class="duo-btn-outline flex-1 py-3 rounded-2xl font-extrabold text-sm">חזרה למסלול</button></div>
            </div>
          </div>
        `;
      }

      if (state.victoryModalUnit) {
        const u = state.victoryModalUnit;
        modalsHtml += `
          <div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-3xl border-2 border-[#ffc800] p-6 text-center space-y-4 shadow-2xl">
              <div class="flex items-center justify-center">
                ${getGazelleMascotHTML("w-32 h-36")}
              </div>
              <span class="inline-block px-3 py-1 rounded-full bg-[#fff5d3] text-[#8c4103] font-extrabold text-xs">كُلُّ الِاحْتِرَام! • השלב הבא נפתח!</span>
              <h2 class="text-2xl font-extrabold text-[#3c3c3c]">סיימת בהצלחה את התרגול ב${escapeHtml(u.unitNumber)}!</h2>
              <p class="text-sm font-bold text-[#777777]">${escapeHtml(u.title)}</p>
              <button onclick="closeVictoryModal()" class="duo-btn-green w-full py-3.5 rounded-2xl font-extrabold text-sm uppercase">המשך במסלול דעוה-לינגו</button>
            </div>
          </div>
        `;
      }

      appEl.innerHTML = `
        <div class="max-w-[1280px] mx-auto flex min-h-screen">
          
          <!-- RIGHT SIDEBAR -->
          <aside class="w-[88px] xl:w-[256px] border-l-2 border-[#e5e5e5] px-4 py-6 flex flex-col justify-between sticky top-0 h-screen bg-white z-20 shrink-0">
            <div>
              <div class="px-2 mb-7 flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-[#fff5d3] border-2 border-[#ffc800] flex items-center justify-center shrink-0 overflow-hidden shadow-sm">
                  ${getGazelleMascotHTML("w-11 h-11")}
                </div>
                <div class="hidden xl:block">
                  <span class="text-[25px] font-extrabold tracking-tight text-[#58cc02] block leading-none">דעוה-לינגו</span>
                  <span class="text-[11px] font-bold text-[#777777]">دَعْوَة-لِينْغُو • לומדים ערבית צעד אחר צעד</span>
                </div>
              </div>

              <nav class="space-y-2">
                ${[
                  { id: 'learn', label: 'מסלול למידה (مَسَار التَّعَلُّم)', icon: '🏠' },
                  { id: 'grammar', label: 'דקדוק (قَوَاعِد)', icon: '📘' },
                  { id: 'stories', label: 'סיפורים (قِصَص) BETA', icon: '📖' },
                  { id: 'dictionary', label: 'מילון (قَامُوس)', icon: '🔍' },
                  { id: 'forum', label: 'קהילה (مُجْتَمَع)', icon: '💬' }
                ].map(function(item) {
                  const isActive = state.activeNav === item.id;
                  return `
                    <button onclick="setNav('${item.id}')" class="w-full flex items-center gap-4 px-4 py-3 rounded-2xl font-extrabold text-[15px] transition-all ${isActive ? 'bg-[#ddf4ff] text-[#1cb0f6] border-2 border-[#84d8ff]' : 'text-[#777777] hover:bg-[#f7f7f7] border-2 border-transparent'}">
                      <span class="text-xl">${item.icon}</span>
                      <span class="hidden xl:inline tracking-wide">${item.label}</span>
                    </button>
                  `;
                }).join('')}
              </nav>
            </div>

            <div class="hidden xl:flex items-center gap-3 p-3 rounded-2xl bg-[#fff5d3]/60 border-2 border-[#ffc800]">
              ${getGazelleMascotHTML("w-14 h-14 shrink-0")}
              <div class="text-xs">
                <p class="font-extrabold text-[#8c4103]">ע׳זאל</p>
                <button onclick="openGazelleChat()" class="text-[#1cb0f6] font-bold hover:underline text-right">שאלו את ע׳זאל כל שאלה ←</button>
              </div>
            </div>
          </aside>

          <!-- CENTER MAIN COLUMN -->
          <main class="flex-1 max-w-[700px] mx-auto px-4 sm:px-6 py-6">
            
            <!-- HERO BANNER WITH GAZELLE MASCOT ONLY -->
            <div class="mb-6 px-6 py-4 rounded-3xl border-2 border-[#e5e5e5] bg-gradient-to-l from-[#f7f7f7] via-white to-[#d7ffb8]/25 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
              <div class="space-y-1.5 text-center sm:text-right">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#58cc02]/15 text-[#58a700] font-extrabold text-xs">
                  <span>أَهْلًا وَسَهْلًا فِي دَعْوَة-لِينْغُو</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-[#3c3c3c]">
                  ברוכים הבאים ל<span class="text-[#58cc02]">דעוה-לינגו</span>!
                </h1>
                <p class="text-xs sm:text-sm font-bold text-[#777777] max-w-md">
                  מתקדמים צעד אחר צעד בערבית: אוצר מילים, דקדוק ותרגול מעשי — במקום אחד.
                </p>
                <p class="text-xs font-extrabold text-[#1cb0f6]">💬 לחצו על הצבי כדי לשוחח איתו</p>
                ${kbIconButton()}
              </div>
              <div class="flex items-center justify-center shrink-0">
                ${getGazelleMascotHTML("w-32 h-36")}
              </div>
            </div>

            ${mainContentHtml}
          </main>

          <!-- LEFT SIDEBAR -->
          <aside class="hidden lg:flex w-[360px] px-6 py-6 flex-col gap-5 sticky top-0 h-screen overflow-y-auto shrink-0">
            <div class="flex items-center justify-between px-3 py-2.5 rounded-2xl border-2 border-[#e5e5e5] bg-[#f7f7f7]">
              <div class="flex items-center gap-2 font-extrabold text-[#3c3c3c] text-xs">
                <span class="px-2.5 py-1 rounded-lg bg-[#007a3d] text-white font-arabic font-bold text-sm">فصحى</span>
                <span>שלבים שהושלמו: <strong>${completedCount} / ${state.units.reduce(function(a, u) { return a + u.nodes.length; }, 0)}</strong></span>
              </div>
              ${completedCount > 0 ? `<button onclick="resetProgress()" class="text-[11px] font-extrabold text-[#ff4b4b] hover:underline">איפוס מסלול</button>` : ''}
            </div>

            <div class="rounded-2xl border-2 border-[#84d8ff] p-4 bg-[#ddf4ff]/40 space-y-3 overflow-hidden">
              <div class="flex items-center justify-between gap-2">
                <span class="font-extrabold text-sm text-[#1cb0f6]">🌐 חיפוש מהיר במילון</span>
                <span class="text-[11px] font-bold text-[#777777]">פעלים, שמות ותארים</span>
              </div>
              <input
                id="quick-search-input"
                type="text"
                value="${escapeHtml(state.wikiQuery)}"
                oninput="handleQuickMorphInput(this.value)"
                placeholder="הקלד פועל, שם עצם או תואר..."
                class="w-full min-w-0 px-3 py-2 rounded-xl border-2 border-[#e5e5e5] bg-white font-arabic text-lg font-bold focus:outline-none focus:border-[#1cb0f6]"
                dir="rtl"
              />
              <div id="quick-sidebar-morph-results" class="space-y-2"></div>
            </div>
          </aside>
        </div>
        ${modalsHtml}
      `;

      renderQuickLookup('quick-sidebar-morph-results', state.wikiQuery);
      if (state.activeNav === 'dictionary') {
        renderMorphologyLookupResults('dict-morph-results', state.dictSearch);
        renderVocabListOnly();
      }
      if (state.activeNav === 'stories' && state.story) {
        setTimeout(function() { const el = document.getElementById('story-end'); if (el) el.scrollIntoView({ block: 'end', behavior: 'smooth' }); }, 40);
      }
      renderSessionOverlay();
    }

    // Boot Application Immediately
    renderApp();
    renderArabicKeyboard();
  </script>
</body>
</html>
